name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: lint and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.11 needs Python 3.14.2 or newer
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install
        run: pip install -r requirements_test.txt

      - name: Home Assistant version
        run: python -c "import homeassistant.const as c; print(c.__version__)"

      - name: ruff
        run: |
          ruff check --output-format github .
          ruff format --check .

      - name: pytest
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Humidifier panel regression
        run: node --test tests/frontend_lv600s.mjs
